<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L'Atelier de Littérature - AI Chatbot</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Montserrat:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <header>
            <h1>L'Atelier de Littérature</h1>
            <p>Uw persoonlijke gids door de wereld van de literatuur.</p>
        </header>

        <main id="chat-container">
            <div id="chat-window">
                <div id="chat-messages">
                    <div class="message ai">
                        <div class="content">
                            Goedemiddag. Ik ben uw literaire assistent. Welk meesterwerk kan ik vandaag voor u opzoeken?
                        </div>
                    </div>
                </div>
            </div>

            <div id="input-area">
                <input type="text" id="user-input" placeholder="Voer een titel, auteur of onderwerp in..." autofocus>
                <button id="send-btn">
                    <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
                </button>
            </div>
        </main>

        <footer>
            <p>&copy; 2024 L'Atelier de Littérature. Aangedreven door AI & Open Library.</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
